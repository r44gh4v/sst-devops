name: 16 - CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - '16-cicd-github-actions/**'
      - '.github/workflows/16-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - '16-cicd-github-actions/**'
      - '.github/workflows/16-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/calculator

defaults:
  run:
    working-directory: 16-cicd-github-actions

jobs:
  # ---------------- CI ----------------
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -v

  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for sensitive files
        run: |
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          fi
          echo "No common sensitive files found."

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: 16-cicd-github-actions/build/

  # ---------------- CD ----------------
  docker-publish:
    name: Build and Push Docker Image
    needs: [build, security-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - name: Smoke test the image
        run: |
          printf '2 + 3\nq\n' | docker run --rm -i $IMAGE_NAME:latest | grep "Result: 5.0"
      - name: Push image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    name: Deploy (simulated)
    needs: docker-publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment: production
    steps:
      - name: Deploy
        run: echo "Deploying ghcr.io/${{ github.repository_owner }}/calculator:${{ github.sha }} to production"
