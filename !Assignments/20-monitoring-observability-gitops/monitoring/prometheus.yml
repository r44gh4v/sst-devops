global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Nothing runs here on purpose - this target stays DOWN so the alert below fires.
  - job_name: demo-app
    static_configs:
      - targets:
          - demo-app:8080
